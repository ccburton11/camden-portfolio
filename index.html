<script type="text/babel">

/* ── Helpers ─────────────────────────────────────── */
const PALETTE = ['var(--teal)', 'var(--coral)', 'var(--pink)', 'var(--orange)', 'var(--purple)', 'var(--yellow)'];
const PALE    = ['var(--teal-light)', 'var(--coral-light)', 'var(--pink-light)', 'var(--orange-light)', 'var(--purple-light)', 'var(--yellow-light)'];
const DARK    = ['var(--teal-dark)', 'var(--coral-dark)', 'var(--pink-dark)', 'var(--orange-dark)', 'var(--purple)', 'var(--yellow-dark)'];

const LINKEDIN = 'https://www.linkedin.com/in/camdenhanzlickburton';

/* ── Button ─────────────────────────────────────── */
function Button({ children, variant = 'coral', size = 'md', href, onClick, type = 'button', disabled }) {
  const [hov, setHov] = React.useState(false);
  const [press, setPress] = React.useState(false);
  const v = {
    coral:   { bg: hov ? 'var(--coral-dark)' : 'var(--coral)', color: '#fff', border: 'none' },
    teal:    { bg: hov ? 'var(--teal-dark)'  : 'var(--teal)',  color: '#fff', border: 'none' },
    yellow:  { bg: hov ? 'var(--yellow-dark)' : 'var(--yellow)', color: 'var(--ink)', border: 'none' },
    outline: { bg: hov ? 'var(--gray-100)' : 'transparent', color: 'var(--ink)', border: '2px solid var(--ink)' },
    'outline-white': { bg: hov ? 'rgba(255,255,255,0.15)' : 'transparent', color: '#fff', border: '2px solid #fff' },
    ghost:   { bg: hov ? 'var(--gray-100)' : 'transparent', color: 'var(--ink-muted)', border: 'none' },
  };
  const s = { sm: { fontSize: 'var(--sm)', padding: '7px 14px' }, md: { fontSize: '0.9375rem', padding: '10px 22px' }, lg: { fontSize: '1rem', padding: '13px 30px' } };
  const style = {
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '6px',
    fontFamily: 'var(--font-sans)', fontWeight: 600, letterSpacing: '0.01em',
    cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.5 : 1,
    borderRadius: 'var(--r-md)', whiteSpace: 'nowrap', transition: 'background var(--fast), transform var(--fast)',
    transform: press ? 'scale(0.97)' : 'none',
    background: v[variant].bg, color: v[variant].color, border: v[variant].border || 'none',
    ...s[size],
  };
  const h = {
    onMouseEnter: () => setHov(true), onMouseLeave: () => { setHov(false); setPress(false); },
    onMouseDown: () => setPress(true), onMouseUp: () => setPress(false),
  };
  if (href) return <a href={href} style={style} {...h}>{children}</a>;
  return <button type={type} style={style} disabled={disabled} onClick={onClick} {...h}>{children}</button>;
}

/* ── Chip ──────────────────────────────────────── */
function Chip({ children, color, bgColor }) {
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', fontFamily: 'var(--font-sans)', fontSize: 'var(--xs)', fontWeight: 600, padding: '3px 10px', borderRadius: 'var(--r-full)', background: bgColor, color: color, whiteSpace: 'nowrap' }}>
      {children}
    </span>
  );
}

/* ── Nav ────────────────────────────────────────── */
function Nav() {
  const [scrolled, setScrolled] = React.useState(false);
  React.useEffect(() => {
    const h = () => setScrolled(window.scrollY > 8);
    window.addEventListener('scroll', h, { passive: true });
    return () => window.removeEventListener('scroll', h);
  }, []);
  return (
    <>
      <div className="stripe" />
      <nav style={{ position: 'sticky', top: 0, zIndex: 100, background: scrolled ? 'rgba(255,255,255,0.97)' : '#fff', backdropFilter: scrolled ? 'blur(12px)' : 'none', boxShadow: scrolled ? 'var(--shadow-nav)' : 'none', borderBottom: scrolled ? '1px solid var(--border-light)' : 'none', transition: 'box-shadow var(--base-ease)' }}>
        <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto', padding: '0 var(--px)', height: 'var(--nav-h)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '24px' }}>
          <a href="#" style={{ fontFamily: 'var(--font-serif)', fontWeight: 800, fontSize: '1.25rem', color: 'var(--teal-deeper)', letterSpacing: '-0.01em' }}>Camden Hanzlick-Burton</a>
          <div style={{ display: 'flex', alignItems: 'center', gap: '28px' }}>
            <div className="nav-links" style={{ display: 'flex', alignItems: 'center', gap: '28px' }}>
              {[['Work','#work'],['Professional Learning','#pl'],['About','#about'],['Publications','#publications']].map(([l,h]) => (
                <a key={h} href={h} style={{ fontFamily: 'var(--font-sans)', fontSize: '0.9375rem', color: 'var(--ink-muted)', fontWeight: 500, transition: 'color var(--fast)' }}>{l}</a>
              ))}
            </div>
            <Button variant="coral" size="sm" href="#contact">Say hello</Button>
          </div>
        </div>
      </nav>
    </>
  );
}

/* ── Hero ──────────────────────────────────────── */
function Hero() {
  return (
    <section style={{ padding: 'clamp(64px,10vw,120px) var(--px) clamp(40px,6vw,64px)', maxWidth: 'var(--max-w)', margin: '0 auto' }}>
      <div className="hero-grid" style={{ display: 'flex', gap: '56px', alignItems: 'center' }}>
        <div style={{ flex: '1 1 480px', minWidth: 0 }}>
          <h1 style={{ fontFamily: 'var(--font-serif)', fontWeight: 800, fontSize: 'var(--display)', lineHeight: 1.08, letterSpacing: '-0.025em', color: 'var(--ink)', marginBottom: '4px' }}>
            Hi, I'm Camden.
          </h1>

          </div>

            I'm a PMP-certified product manager and learning leader who brings classroom, project management, and curriculum development experience to products — always while keeping the learner at the center from prototype to scale.
          </p>
          <div style={{ display: 'flex', gap: '14px', flexWrap: 'wrap' }}>
            <Button variant="coral" size="lg" href="#work">See the work</Button>
            <Button variant="outline" size="lg" href="#contact">Say hello</Button>
          </div>
          <div style={{ display: 'flex', gap: '10px', marginTop: '64px' }}>
            {PALETTE.map((c, i) => (
              <div key={i} style={{ width: i === 0 ? '48px' : '12px', height: '12px', borderRadius: 'var(--r-full)', background: c, flexShrink: 0 }} />
            ))}
          </div>
        </div>
        <div className="hero-photo" style={{ flex: '0 0 300px', width: '300px' }}>
          <div style={{ position: 'relative', borderRadius: 'var(--r-xl)', overflow: 'hidden', boxShadow: 'var(--shadow-md)', border: '1px solid var(--border-light)' }}>
            <img src="assets/headshot.jpg" alt="Camden Hanzlick-Burton" style={{ display: 'block', width: '100%', height: 'auto', aspectRatio: '2 / 3', objectFit: 'cover' }} />
          </div>
        </div>
      </div>
    </section>
  );
}

/* ── Proof strip ───────────────────────────────── */
const STATS = [
  { n: '1000+', label: "schools I've worked directly with", color: 'var(--teal)' },
  { n: '$50M+', label: "in program funding kept on budget", color: 'var(--coral)' },
  { n: '200,000+', label: 'students reached in Title I schools', color: 'var(--pink)' },
  { n: '14+', label: 'years in the education field', color: 'var(--orange)' },
];
function ProofStrip() {
  return (
    <section style={{ padding: '0 var(--px) clamp(48px,7vw,72px)', maxWidth: 'var(--max-w)', margin: '0 auto' }}>
      <div className="stat-strip" style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '16px' }}>
        {STATS.map((s, i) => (
          <div key={i} style={{ background: 'var(--gray-50)', border: '1px solid var(--border-light)', borderRadius: 'var(--r-lg)', padding: '22px 20px' }}>
            <div style={{ width: '28px', height: '4px', background: s.color, borderRadius: '2px', marginBottom: '12px' }} />
            <div style={{ fontFamily: 'var(--font-serif)', fontWeight: 800, fontSize: '2rem', lineHeight: 1.1, color: 'var(--ink)', marginBottom: '6px' }}>{s.n}</div>
            <div style={{ fontFamily: 'var(--font-sans)', fontSize: 'var(--xs)', lineHeight: 1.5, color: 'var(--ink-muted)' }}>{s.label}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

/* ── Point of view ─────────────────────────────── */
function POVSection() {
  return (
    <div style={{ borderTop: '1px solid var(--border-light)', borderBottom: '1px solid var(--border-light)' }}>
      <div className="section" style={{ paddingTop: 'clamp(48px,7vw,72px)', paddingBottom: 'clamp(48px,7vw,72px)' }}>
        <p style={{ fontFamily: 'var(--font-sans)', fontSize: 'var(--xs)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--purple)', marginBottom: '10px' }}>What I think</p>
        <h2 style={{ fontFamily: 'var(--font-serif)', fontWeight: 800, fontSize: 'var(--h2)', letterSpacing: '-0.02em', color: 'var(--ink)', lineHeight: 1.15, marginBottom: '24px', maxWidth: '720px' }}>
          Education keeps looking for technology to solve its problems. We're asking the wrong questions.
        </h2>
        <div style={{ maxWidth: '720px', display: 'flex', flexDirection: 'column', gap: '16px' }}>
          <p style={{ fontFamily: 'var(--font-sans)', fontSize: 'var(--lg)', lineHeight: 1.75, color: 'var(--ink-muted)', fontWeight: 300 }}>
            First it was bridging the digital divide — getting devices and access to the students who needed them most, and helping teachers and school leaders actually use that access well. Then it was screen time and digital wellness. Now it's AI, and we're back to the same worry: what is this technology doing to kids.
          </p>
          <p style={{ fontFamily: 'var(--font-sans)', fontSize: 'var(--lg)', lineHeight: 1.75, color: 'var(--ink-muted)' }}>
            But the question hasn't actually changed: what do learning experiences need to look like so students are prepared — mentally, physically, emotionally — for life after school? What would schools and education products look like if they worked for every student regardless of zip code, from a household of two to a public school system serving millions?
          </p>
          <p style={{ fontFamily: 'var(--font-sans)', fontSize: 'var(--lg)', lineHeight: 1.75, color: 'var(--ink-muted)' }}>
            I don't think the answer is simply a better app or tools. It's building for who a student actually is, instead of handing them a product and asking them to adapt to it. Students should be active participants in that — able to say "this is who I want to become" — with a system that gives them the people, materials, and the tools to get there. Learning — and the products for learning — should be built for the students, not the other way around.
          </p>
          <p style={{ fontFamily: 'var(--font-serif)', fontSize: 'var(--h3)', fontWeight: 700, lineHeight: 1.4, color: 'var(--teal-deeper)', marginTop: '8px' }}>
            What can products look like that build around authentic relationships, rigorous materials, and provide the right support at the right time?
          </p>
        </div>
      </div>
    </div>
  );
}

function ProjectCard({ project, colorIdx }) {
  const [hov, setHov] = React.useState(false);
  const [open, setOpen] = React.useState(false);
  const accent = PALETTE[colorIdx % PALETTE.length];
  const pale   = PALE[colorIdx % PALE.length];
  const dark   = DARK[colorIdx % DARK.length];
  return (
    <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{ background: 'var(--white)', borderRadius: 'var(--r-xl)', overflow: 'hidden', boxShadow: hov ? 'var(--shadow-md)' : 'var(--shadow-sm)', border: '1px solid var(--border-light)', transform: hov && !open ? 'translateY(-4px)' : 'none', transition: 'box-shadow var(--fast), transform var(--fast)', display: 'flex', flexDirection: 'column' }}>
      <div style={{ height: '6px', background: accent }} />
      <div style={{ padding: '24px', display: 'flex', flexDirection: 'column', gap: '12px', flex: 1 }}>
        <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
          {project.tags.map((t, i) => <Chip key={i} color={dark} bgColor={pale}>{t}</Chip>)}
        </div>
        <div style={{ fontFamily: 'var(--font-serif)', fontWeight: 700, fontSize: 'var(--h3)', lineHeight: 1.3, color: 'var(--ink)' }}>{project.title}</div>
        <div style={{ fontFamily: 'var(--font-sans)', fontSize: 'var(--xs)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: dark }}>{project.org}</div>
        <p style={{ fontFamily: 'var(--font-sans)', fontSize: 'var(--sm)', lineHeight: 1.65, color: 'var(--ink-muted)', margin: 0 }}>{project.description}</p>
        {open && (
          <div style={{ borderTop: '1px solid var(--border-light)', paddingTop: '14px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
            {project.detail.map(([h, body], i) => (
              <div key={i}>
                <div style={{ fontFamily: 'var(--font-sans)', fontSize: 'var(--xs)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.08em', color: dark, marginBottom: '3px' }}>{h}</div>
                <p style={{ fontFamily: 'var(--font-sans)', fontSize: 'var(--sm)', lineHeight: 1.65, color: 'var(--ink-muted)', margin: 0 }}>{body}</p>
              </div>
            ))}
